<title>나의 일정 수첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: planner spread — month grid on the left page, the chosen day's agenda on the right; stacks on phones. */
:root {
  --paper: #f5f6f8;
  --sheet: #ffffff;
  --ink: #1d2433;
  --ink-soft: #5b6476;
  --rule: #dde1e8;
  --accent: #2b59c3;
  --accent-soft: #e6ecfa;
  --sun: #c8402f;
  --sat: #2f6fb6;
  --c-work: #2b59c3;
  --c-personal: #2f8a5f;
  --c-health: #c47a12;
  --c-meet: #a5428a;
  --c-etc: #6b7280;
  --c-gcal: #12807a;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151c; --sheet: #1a1f29; --ink: #e7eaf0; --ink-soft: #9aa3b5; --rule: #2c3342;
    --accent: #7d9ef0; --accent-soft: #233154; --sun: #f0806f; --sat: #7fb0ec;
    --c-work: #7d9ef0; --c-personal: #5cc293; --c-health: #e9a948; --c-meet: #d483bf; --c-etc: #9aa3b5; --c-gcal: #4fc4b8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151c; --sheet: #1a1f29; --ink: #e7eaf0; --ink-soft: #9aa3b5; --rule: #2c3342;
  --accent: #7d9ef0; --accent-soft: #233154; --sun: #f0806f; --sat: #7fb0ec;
  --c-work: #7d9ef0; --c-personal: #5cc293; --c-health: #e9a948; --c-meet: #d483bf; --c-etc: #9aa3b5; --c-gcal: #4fc4b8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 18px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: grid; gap: 2px; }
.brand h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
.brand .today-line { color: var(--ink-soft); font-size: 0.9rem; }
.status { font-size: 0.78rem; color: var(--ink-soft); letter-spacing: 0.02em; }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 7px 12px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); font-weight: 600; }
.btn.danger { color: var(--sun); }
.btn.danger.armed { background: var(--sun); border-color: var(--sun); color: var(--sheet); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 7px 12px; min-width: 0; width: 200px; max-width: 100%; }

.summary { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--sheet); border: 1px solid var(--rule); font-size: 0.85rem; color: var(--ink-soft); }
.chip b { color: var(--ink); font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.spread { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .spread { grid-template-columns: minmax(0, 1fr); } }
.page { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; min-width: 0; }

.month-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.month-head h2 { margin: 0; font-size: 1.15rem; font-weight: 600; }
.nav { display: flex; gap: 6px; }
.nav .btn { padding: 5px 10px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dow { text-align: center; font-size: 0.75rem; letter-spacing: 0.08em; color: var(--ink-soft); padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.dow.sun { color: var(--sun); } .dow.sat { color: var(--sat); }
.cell { border: 0; border-bottom: 1px solid var(--rule); background: transparent; text-align: left; padding: 6px 4px 6px; min-height: 84px; display: flex; flex-direction: column; gap: 3px; min-width: 0; border-radius: 0; }
.cell:hover { background: var(--accent-soft); }
.cell.out { opacity: 0.4; }
.cell .num { font-family: var(--font-mono); font-size: 0.85rem; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.cell.sun .num, .cell.hol .num { color: var(--sun); }
.cell.sat .num { color: var(--sat); }
.cell.today .num { background: var(--ink); color: var(--sheet); }
.cell.sel { background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
.hol-name { font-size: 0.68rem; color: var(--sun); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: 0.72rem; line-height: 1.3; padding: 1px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--ink); border-left: 2px solid var(--c); }
.pill.done { text-decoration: line-through; opacity: 0.55; }
.more { font-size: 0.7rem; color: var(--ink-soft); padding-left: 2px; }
@media (max-width: 520px) {
  .cell { min-height: 58px; padding: 4px 2px; }
  .pill, .hol-name { display: none; }
  .cell .marks { display: flex; gap: 3px; flex-wrap: wrap; padding-left: 4px; }
}
.marks { display: none; }
.marks .dot { width: 6px; height: 6px; }

.agenda h2 { margin: 0; font-size: 1.1rem; font-weight: 600; text-wrap: balance; }
.agenda .sub { color: var(--ink-soft); font-size: 0.85rem; }
.agenda-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.item { display: grid; grid-template-columns: auto 64px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--rule); }
.item:first-child { border-top: 0; }
.item .check { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.item .time { font-size: 0.82rem; color: var(--ink-soft); padding-top: 2px; }
.item .body { min-width: 0; border: 0; background: none; text-align: left; padding: 0; display: grid; gap: 2px; }
.item .title { font-weight: 600; overflow-wrap: anywhere; }
.item.done .title { text-decoration: line-through; color: var(--ink-soft); }
.item .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.8rem; color: var(--ink-soft); }
.item .note { font-size: 0.82rem; color: var(--ink-soft); overflow-wrap: anywhere; }
.empty { padding: 18px 0 6px; color: var(--ink-soft); font-size: 0.9rem; }
.section-label { font-size: 0.75rem; letter-spacing: 0.08em; color: var(--ink-soft); margin: 18px 0 4px; }
.up-date { font-size: 0.78rem; color: var(--ink-soft); }

dialog { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--sheet); color: var(--ink); padding: 0; width: min(440px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(10 14 22 / 0.45); }
form.editor { display: grid; gap: 12px; padding: 18px; }
form.editor h3 { margin: 0; font-size: 1.05rem; }
.field { display: grid; gap: 4px; }
.field label { font-size: 0.8rem; color: var(--ink-soft); }
.field input, .field select, .field textarea { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; background: var(--paper); width: 100%; min-width: 0; }
.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .row .field:first-child { grid-column: 1 / -1; } }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cats label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 10px; font-size: 0.85rem; cursor: pointer; }
.cats input { position: absolute; opacity: 0; pointer-events: none; }
.cats input:checked + span { font-weight: 600; }
.cats label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.cats label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.actions .right { display: flex; gap: 8px; }
.err { color: var(--sun); font-size: 0.85rem; min-height: 1em; }
.gbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 0.85rem; color: var(--ink-soft); }
.gbar .gname { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 600; }
.gbar .gmsg { min-width: 0; overflow-wrap: anywhere; }
.gbar .gmsg.warn { color: var(--sun); }
.gbar .btn { padding: 4px 10px; font-size: 0.82rem; }
.switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.switch input { accent-color: var(--c-gcal); width: 16px; height: 16px; }
.pill.g { border-left-style: dotted; border-left-width: 3px; }
.gbadge { width: 18px; height: 18px; margin-top: 3px; border-radius: 4px; display: grid; place-items: center; font-size: 0.7rem; font-weight: 700; color: var(--sheet); background: var(--c-gcal); }
a.body { color: inherit; text-decoration: none; }
a.body:hover .title { text-decoration: underline; }
.ghint { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 0.82rem; color: var(--ink-soft); background: color-mix(in srgb, var(--c-gcal) 10%, transparent); border-radius: 8px; padding: 8px 10px; }
.ghint .gbadge { margin-top: 0; }
.ghint a { color: var(--c-gcal); font-weight: 600; }
.field input:disabled { opacity: 0.6; }
.opt { display: flex; align-items: flex-start; gap: 8px; font-size: 0.88rem; }
.opt input { margin-top: 4px; accent-color: var(--c-gcal); }
.opt small { display: block; color: var(--ink-soft); font-size: 0.78rem; }
[hidden] { display: none !important; }
.backup { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.backup .btn { padding: 4px 10px; font-size: 0.82rem; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 8px 14px; border-radius: 8px; font-size: 0.88rem; max-width: calc(100vw - 32px); width: max-content; }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .2s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>나의 일정 수첩</h1>
      <div class="today-line" id="todayLine"></div>
    </div>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="일정 검색" aria-label="일정 검색">
      <button class="btn" id="goToday" type="button">오늘</button>
      <button class="btn primary" id="addBtn" type="button">+ 새 일정</button>
    </div>
  </header>

  <div class="summary" id="summary"></div>
  <div class="gbar" id="gbar" hidden>
    <span class="gname"><span class="dot" style="background:var(--c-gcal)"></span>Google 캘린더</span>
    <label class="switch" id="gShowWrap" hidden><input type="checkbox" id="gShow" checked> 달력에 표시</label>
    <span class="gmsg" id="gMsg"></span>
    <button class="btn" id="gConnect" type="button" hidden>연결하기</button>
    <button class="btn" id="gRefresh" type="button" hidden>새로고침</button>
  </div>

  <div class="spread">
    <section class="page" aria-label="월간 달력">
      <div class="month-head">
        <h2 id="monthTitle"></h2>
        <div class="nav">
          <button class="btn" id="prevM" type="button" aria-label="이전 달">‹</button>
          <button class="btn" id="nextM" type="button" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="page agenda" aria-label="선택한 날의 일정">
      <div class="agenda-head">
        <div>
          <h2 id="dayTitle"></h2>
          <div class="sub" id="daySub"></div>
        </div>
        <button class="btn" id="addDay" type="button">+ 추가</button>
      </div>
      <ul class="list" id="dayList"></ul>
      <div class="section-label" id="upLabel">앞으로 7일</div>
      <ul class="list" id="upList"></ul>
    </section>
  </div>
  <div class="status" id="status">불러오는 중…</div>
  <div class="backup">
    <span class="status">일정 백업</span>
    <button class="btn" id="exportBtn" type="button" title="일정을 JSON 파일로 저장합니다">내보내기</button>
    <button class="btn" id="importBtn" type="button" title="내보낸 JSON 파일에서 일정을 가져옵니다">가져오기</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</div>

<dialog id="dlg">
  <form class="editor" id="form" novalidate>
    <h3 id="formTitle">새 일정</h3>
    <div class="ghint" id="fHint" hidden><span class="gbadge">G</span><span id="fHintText"></span><a id="fLink" target="_blank" rel="noopener" hidden>Google 캘린더에서 열기</a></div>
    <div class="field">
      <label for="fTitle">제목</label>
      <input id="fTitle" name="title" maxlength="120" placeholder="예: 팀 주간 회의" required>
    </div>
    <div class="row">
      <div class="field"><label for="fDate">날짜</label><input id="fDate" type="date" required></div>
      <div class="field"><label for="fStart">시작</label><input id="fStart" type="time"></div>
      <div class="field"><label for="fEnd">종료</label><input id="fEnd" type="time"></div>
    </div>
    <div class="field" id="fCatField">
      <span style="font-size:.8rem;color:var(--ink-soft)">분류</span>
      <div class="cats" id="fCats"></div>
    </div>
    <div class="field">
      <label for="fNote">메모</label>
      <textarea id="fNote" rows="3" maxlength="1000" placeholder="장소, 준비물 등"></textarea>
    </div>
    <label class="opt" id="fGcalWrap" hidden>
      <input type="checkbox" id="fGcal">
      <span>Google 캘린더에도 추가<small>이후 이 수첩에서 고치거나 지우면 Google 캘린더에도 반영됩니다.</small></span>
    </label>
    <div class="err" id="fErr" role="alert"></div>
    <div class="actions">
      <button class="btn danger" id="fDelete" type="button">삭제</button>
      <div class="right">
        <button class="btn" id="fCancel" type="button">취소</button>
        <button class="btn primary" type="submit">저장</button>
      </div>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" hidden></div>

<script>
const CATS = [
  { id: "work", name: "업무", color: "var(--c-work)" },
  { id: "personal", name: "개인", color: "var(--c-personal)" },
  { id: "health", name: "건강", color: "var(--c-health)" },
  { id: "meet", name: "약속", color: "var(--c-meet)" },
  { id: "etc", name: "기타", color: "var(--c-etc)" },
];
const GCAL_CAT = { id: "gcal", name: "Google 캘린더", color: "var(--c-gcal)" };
const catOf = id => id === "gcal" ? GCAL_CAT : (CATS.find(c => c.id === id) || CATS[4]);
const GSERVER = "Google Calendar";

// 대한민국 공휴일 (대체공휴일 포함)
const HOLIDAYS = {
  "2026-01-01": "신정", "2026-02-16": "설날 연휴", "2026-02-17": "설날", "2026-02-18": "설날 연휴",
  "2026-03-01": "삼일절", "2026-03-02": "대체공휴일", "2026-05-05": "어린이날", "2026-05-24": "부처님오신날",
  "2026-05-25": "대체공휴일", "2026-06-03": "지방선거", "2026-06-06": "현충일", "2026-08-15": "광복절",
  "2026-08-17": "대체공휴일", "2026-09-24": "추석 연휴", "2026-09-25": "추석", "2026-09-26": "추석 연휴",
  "2026-10-03": "개천절", "2026-10-05": "대체공휴일", "2026-10-09": "한글날", "2026-12-25": "성탄절",
  "2027-01-01": "신정",
};
const DOW = ["일", "월", "화", "수", "목", "금", "토"];

const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const longDate = s => { const d = parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`; };
const sortEv = (a, b) => a.date.localeCompare(b.date) || (a.start || "99").localeCompare(b.start || "99") || a.title.localeCompare(b.title);

const state = {
  today: ymd(new Date()),
  selected: ymd(new Date()),
  view: (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })(),
  events: [],
  query: "",
  mode: "loading", // loading | db | local
  editing: null,
  // Google 캘린더: off(쓸 수 없음) | idle(연결 전) | loading | ok | error
  g: { status: "off", events: [], msg: "", partial: false, show: true, range: "" },
};
try { state.g.show = localStorage.getItem("schedule.gcal.show") !== "0"; } catch {}

// ---------- 저장소 ----------
const IS_DESKTOP_APP = /\bElectron\//.test(navigator.userAgent); // 데스크톱 앱(Electron)으로 열렸는지
let col = null;
const LS_KEY = "schedule.events.v1";
function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { return []; } }
function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(state.events)); return true; } catch { return false; } }
const newId = () => "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

async function saveEvent(ev) {
  const { id, ...body } = ev;
  if (state.mode === "db") { await col.doc(id).set(body); return; }
  const i = state.events.findIndex(e => e.id === id);
  if (i >= 0) state.events[i] = ev; else state.events.push(ev);
  if (!lsSave()) throw new Error("이 브라우저에서는 저장할 수 없습니다.");
  render();
}
async function removeEvent(id) {
  if (state.mode === "db") { await col.doc(id).delete(); return; }
  state.events = state.events.filter(e => e.id !== id);
  lsSave(); render();
}

async function connect() {
  let db = null;
  try { db = window.claude?.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) {
    state.mode = "local";
    state.events = lsLoad();
    render();
    return;
  }
  col = db.collection("events");
  col.onSnapshot(snap => {
    state.mode = "db";
    state.events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => {
    state.mode = "local";
    state.events = lsLoad();
    render();
    toast(err.code === "revoked" ? "접근 권한이 바뀌어 이 기기에만 저장합니다." : "서버 연결이 끊겨 이 기기에만 저장합니다.");
  });
}

// ---------- 렌더링 ----------
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

function allEvents() {
  if (!state.g.show || !state.g.events.length) return state.events;
  // 수첩과 연결된 Google 일정은 한 번만 보여 주고, Google에서 바뀐 제목·시간을 반영한다
  const byGid = new Map();
  for (const g of state.g.events) if (!byGid.has(g.gid)) byGid.set(g.gid, g);
  const linked = new Set();
  const mine = state.events.map(e => {
    const g = e.gcalId && byGid.get(e.gcalId);

    linked.add(e.gcalId);
    return { ...e, title: g.title, date: g.date, start: g.start, end: g.end, location: g.location, link: g.link };
  });
  return mine.concat(state.g.events.filter(e => !linked.has(e.gid)));
}
function visible() {

}
function byDate(list) {
  const m = new Map();
  for (const e of list) { if (!m.has(e.date)) m.set(e.date, []); m.get(e.date).push(e); }
  for (const arr of m.values()) arr.sort(sortEv);

}

// ---------- Google 캘린더 ----------
let mcp = null, gUnwatch = null;
const isoMidnight = s => parse(s).toISOString();
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

function gridRange() {
  const { y, m } = state.view;
  const first = new Date(y, m, 1);
  const start = ymd(new Date(y, m, 1 - first.getDay()));
  const weeks = Math.ceil((first.getDay() + new Date(y, m + 1, 0).getDate()) / 7);
  return { from: start, to: addDays(start, weeks * 7) };
}

function plainText(html) {
  if (!html) return "";
  const t = String(html).replace(/<br\s*\/?>/gi, "\n").replace(/<\/p>/gi, "\n").replace(/<[^>]+>/g, "");
  const ta = document.createElement("textarea"); ta.innerHTML = t; // HTML 엔티티 풀기
  return ta.value.trim();
}

// Google 일정 하나를 수첩 형식으로. 종일 일정은 걸친 날마다 하나씩.
function fromGoogle(ev) {
  if (!ev || ev.status === "cancelled" || !ev.start) return [];
  const base = {
    source: "gcal", gid: ev.id, title: ev.summary || "(제목 없음)", cat: "gcal",
    location: ev.location || "", desc: plainText(ev.description), note: plainText(ev.description).replace(/\s+/g, " ").slice(0, 160),
    link: typeof ev.htmlLink === "string" && ev.htmlLink.startsWith("https://") ? ev.htmlLink : "",
  };
  if (ev.start.date) {
    const out = [];
    const last = ev.end?.date ? addDays(ev.end.date, -1) : ev.start.date;
    const multi = last > ev.start.date;
    for (let d = ev.start.date, i = 0; d <= last && i < 62; d = addDays(d, 1), i++)
      out.push({ ...base, id: `g_${ev.id}_${d}`, date: d, start: "", end: "", multi, first: ev.start.date });
    return out;
  }
  const s = new Date(ev.start.dateTime), en = ev.end?.dateTime ? new Date(ev.end.dateTime) : null;
  if (isNaN(s)) return [];
  const sameDay = en && ymd(en) === ymd(s);
  return [{ ...base, id: "g_" + ev.id, date: ymd(s), start: hm(s), end: sameDay ? hm(en) : "", multi: !!en && !sameDay }];
}

const G_FIX = {
  needs_reauth: "연결이 만료됐습니다. claude.ai 설정 → 커넥터에서 Google Calendar를 다시 연결하세요.",
  server_not_connected: "Google Calendar 커넥터가 없습니다. claude.ai 설정 → 커넥터에서 추가하세요.",
  selection_required: "Google Calendar 커넥터가 여러 개입니다. 화면에 뜨는 선택 창에서 하나를 고르세요.",
  not_in_manifest: "이 페이지에서 Google 캘린더 사용이 허용되지 않았습니다. 페이지의 권한 메뉴에서 켤 수 있습니다.",
  blocked_by_policy: "조직 정책으로 Google 캘린더를 불러올 수 없습니다.",
  approval_required: "조직 정책상 승인이 필요해 Google 캘린더를 불러올 수 없습니다.",
  server_not_found: "연결된 Google Calendar 커넥터를 찾을 수 없습니다. 커넥터를 다시 추가하세요.",
};
const G_DENY = new Set(["needs_reauth", "server_not_connected", "selection_required", "not_in_manifest", "blocked_by_policy", "approval_required", "server_not_found", "not_granted", "capability_disabled", "capability_removed"]);

function watchGoogle(force) {
  if (!mcp || state.g.status === "off" || state.g.status === "idle") return;
  const { from, to } = gridRange();
  const key = from + "|" + to;
  if (!force && key === state.g.range && gUnwatch) return;
  if (gUnwatch) gUnwatch();
  state.g.range = key;
  state.g.status = "loading"; state.g.events = []; state.g.partial = false;
  const input = { startTime: isoMidnight(from), endTime: isoMidnight(to), pageSize: 250, orderBy: "startTime" };
  let retried = false;
  gUnwatch = mcp.watchTool(GSERVER, "list_events", input, ev => {
    if (state.g.range !== key) return;
    if (ev.type === "data") {
      const p = ev.result?.payload;
      const list = Array.isArray(p?.events) ? p.events : [];
      state.g.events = list.flatMap(fromGoogle);
      state.g.partial = !!p?.nextPageToken;
      state.g.status = "ok";
      state.g.at = ev.result?.cache?.storedAt || Date.now();
      state.g.msg = "";
    } else {
      const code = ev.error?.code;
      if (G_DENY.has(code)) { state.g.events = []; state.g.status = "error"; state.g.msg = G_FIX[code] || "이 화면에서는 Google 캘린더를 쓸 수 없습니다."; }
      else if (ev.error?.retryable && !retried) {
        retried = true;
        state.g.msg = "Google 캘린더에 잠시 연결되지 않습니다. 다시 시도하는 중…";
        setTimeout(() => { if (state.g.range === key) mcp.invalidate(GSERVER, "list_events").catch(() => {}); }, (ev.error.retryAfterMs || 1500) + Math.random() * 1000);
      } else {
        state.g.status = state.g.events.length ? "ok" : "error";
        state.g.msg = code === "tool_error" ? "Google 캘린더가 오류를 알렸습니다: " + (ev.error.message || "") : "Google 캘린더에 연결하지 못했습니다. 잠시 뒤 새로고침하세요.";
      }
    }
    render();
  }, { refetchInterval: 5 * 60 * 1000 });
}

async function connectGoogle() {
  let m = null;
  try { m = window.claude?.use ? await window.claude.use("mcp") : null; } catch { m = null; }
  if (!m) { state.g.status = "off"; render(); return; }
  mcp = m;
  let perm = "prompt";
  try { const pm = await window.claude.use("permissions"); if (pm) perm = await pm.state("mcp:" + GSERVER).catch(() => "prompt"); } catch {}
  if (perm === "unavailable" || perm === "denied") {
    state.g.status = "error";
    state.g.msg = perm === "denied" ? G_FIX.not_in_manifest : "이 화면에서는 Google 캘린더를 쓸 수 없습니다.";
    render(); return;
  }
  if (perm === "granted") { state.g.status = "loading"; watchGoogle(true); }
  else state.g.status = "idle"; // 첫 호출이 허락을 묻기 때문에 버튼을 누를 때 시작
  render();
}

function renderGbar() {
  const g = state.g;
  $("gbar").hidden = g.status === "off";
  $("gConnect").hidden = g.status !== "idle";
  $("gShowWrap").hidden = !(g.status === "ok" || g.status === "loading");
  $("gRefresh").hidden = g.status !== "ok" && g.status !== "error";
  $("gShow").checked = g.show;
  const msg = $("gMsg");
  msg.classList.toggle("warn", g.status === "error" || !!(g.msg && g.status === "ok"));
  if (g.status === "idle") msg.textContent = "연결하면 Google 캘린더 일정이 달력에 함께 보입니다.";
  else if (g.status === "loading") msg.textContent = "일정을 불러오는 중…";
  else if (g.status === "ok" && !g.msg) {
    const n = new Set(g.events.map(e => e.gid)).size;
    const t = new Date(g.at || Date.now());
    msg.textContent = `이 화면 기간에 ${n}개 · ${hm(t)} 기준` + (g.partial ? " · 일정이 많아 일부만 표시" : "");
  } else msg.textContent = g.msg;
}

$("gRefresh").addEventListener("click", () => {

  mcp?.invalidate(GSERVER, "list_events").catch(() => watchGoogle(true));
});
$("gShow").addEventListener("change", e => {

  render();
});

// 수첩의 날짜·시간을 Google 형식으로. 종료가 없으면 1시간짜리.
function googleTimes(ev) {
  const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Seoul";
  if (!ev.start) return { allDay: true, timeZone, startTime: `${ev.date}T00:00:00`, endTime: `${addDays(ev.date, 1)}T00:00:00` };
  let end = ev.end;
  if (!end) { const [h, mi] = ev.start.split(":").map(Number); end = h >= 23 ? "23:59" : `${pad(h + 1)}:${pad(mi)}`; }
  return { allDay: false, timeZone, startTime: `${ev.date}T${ev.start}:00`, endTime: `${ev.date}T${end}:00` };
}
const refreshGoogle = () => mcp?.invalidate(GSERVER, "list_events").catch(() => {});

async function addToGoogle(ev) {
  const t = googleTimes(ev);
  const input = { summary: ev.title, ...t };
  if (!t.allDay) delete input.allDay;
  if (ev.note) input.description = ev.note;
  const res = await mcp.callTool(GSERVER, "create_event", input);
  refreshGoogle();
  const p = res?.payload;
  return typeof p?.id === "string" ? p.id : "";
}
// 바뀐 필드만 보낸다. 바뀐 게 없으면 호출하지 않는다.
async function updateGoogle(gid, before, after, opts = {}) {
  const input = { eventId: gid };
  if (after.title !== before.title) input.summary = after.title;
  if (!opts.keepTimes && (after.date !== before.date || after.start !== before.start || after.end !== before.end)) Object.assign(input, googleTimes(after));
  if ((after.note || "") !== (before.note || "")) input.description = after.note || "";
  if (Object.keys(input).length === 1) return false;
  await mcp.callTool(GSERVER, "update_event", input);
  refreshGoogle();
  return true;
}
async function deleteGoogle(gid) {
  await mcp.callTool(GSERVER, "delete_event", { eventId: gid });
  refreshGoogle();
}
// Google 쓰기 실패를 사람이 읽는 말로. 응답이 없었던 경우는 실제로 반영됐을 수도 있다.
function gWriteMsg(err, what) {
  const c = err?.code;
  if (G_FIX[c]) return `Google 캘린더 ${what} 실패: ${G_FIX[c]}`;
  if (c === "server_unavailable" || c === "upstream_error" || c === "cancelled") return `Google 캘린더가 응답하지 않았습니다. ${what}됐는지 Google 캘린더에서 확인하세요.`;
  if (c === "tool_error") return `Google 캘린더가 요청을 거절했습니다` + (err.message ? `: ${err.message}` : ". 내가 만든 일정이 아니면 바꿀 수 없을 수 있습니다.");
  return `Google 캘린더 ${what}에 실패했습니다.`;
}

function openEditor(ev, date) {

      : lockTimes ? "여러 날에 걸친 일정입니다. 제목과 메모만 고칠 수 있고, 날짜·시간은 Google 캘린더에서 바꾸세요."
      : isG ? "Google 캘린더 일정입니다. 저장하거나 삭제하면 Google 캘린더가 바로 바뀝니다."
      : "Google 캘린더와 연결된 일정입니다. 저장·삭제가 Google 캘린더에도 반영됩니다.";
    const link = ev.link || "";
    $("fLink").hidden = !link; if (link) $("fLink").href = link;
  } else $("fHint").hidden = true;
  $("fErr").textContent = "";
  $("fDelete").hidden = !ev || (isG && !gReady());
  $("fGcal").checked = false;
  $("fGcalWrap").hidden = !(gReady() && !isG && !linked);
  for (const b of $("form").querySelectorAll("button")) b.disabled = false;
  disarm();
  dlg.showModal();
  $("fTitle").focus();
}
function disarm() {
  deleteArmed = false; $("fDelete").classList.remove("armed");
  $("fDelete").textContent = "삭제";
}
function busy(on) { for (const b of $("form").querySelectorAll("button")) b.disabled = on; }
const errMsg = err => err?.code === "quota_exceeded" ? "저장 공간이 가득 찼습니다. 지난 일정을 지운 뒤 다시 시도하세요."
  : err?.code === "invalid_argument" ? "이 일정을 저장할 권한이 없습니다."
  : (err?.message || "저장하지 못했습니다. 잠시 후 다시 시도하세요.");

function afterSave(date) {
  dlg.close();
  state.selected = date;
  const d = parse(date); state.view = { y: d.getFullYear(), m: d.getMonth() };
  render(); watchGoogle();
}

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const title = $("fTitle").value.trim();
  const date = $("fDate").value;
  const start = $("fStart").value, end = $("fEnd").value;
  if (!title) { $("fErr").textContent = "제목을 입력하세요."; $("fTitle").focus(); return; }
  if (!date) { $("fErr").textContent = "날짜를 고르세요."; return; }
  if (start && end && end < start) { $("fErr").textContent = "종료 시간이 시작 시간보다 빠릅니다."; return; }
  if (!start && end) { $("fErr").textContent = "종료 시간을 쓰려면 시작 시간도 넣으세요."; return; }
  const note = $("fNote").value.trim();

  // Google 전용 일정: Google 캘린더만 고친다. 실패하면 창을 열어 둔다.
  if (editingG) {
    const g = editingG;
    const before = { title: g.title, date: g.date, start: g.start, end: g.end, note: g.desc };
    busy(true);
    try {
      const changed = await updateGoogle(g.gid, before, { title, date, start, end, note }, { keepTimes: g.multi });
      afterSave(g.multi ? g.date : date);
      toast(changed ? "Google 캘린더 일정을 고쳤습니다" : "바뀐 내용이 없습니다");
    } catch (err) { busy(false); $("fErr").textContent = gWriteMsg(err, "수정"); }
    return;
  }

  const prev = state.events.find(e => e.id === state.editing);
  const data = {
    id: state.editing || newId(), title, date, start, end,
    cat: document.querySelector('input[name="cat"]:checked')?.value || "etc",
    note, done: prev?.done || false,
    created: prev?.created || new Date().toISOString(),
  };
  if (prev?.gcalId) data.gcalId = prev.gcalId;
  const toGoogle = gReady() && !prev?.gcalId && !$("fGcalWrap").hidden && $("fGcal").checked;
  busy(true);
  try {
    await saveEvent(data);
  } catch (err) { $("fErr").textContent = errMsg(err); busy(false); return; }
  afterSave(date);

  if (prev?.gcalId && gReady()) {
    // 비교 기준은 편집 창을 열 때 보이던 값(Google에서 바뀐 내용이 반영된 값)
    const v = editingView || prev;
    try {
      const changed = await updateGoogle(prev.gcalId, { title: v.title, date: v.date, start: v.start, end: v.end, note: prev.note }, data);
      toast(changed ? "일정을 고쳤습니다 · Google 캘린더에도 반영" : "일정을 고쳤습니다");
    } catch (err) { toast("수첩에는 저장했습니다. " + gWriteMsg(err, "수정")); }
    return;
  }
  if (!toGoogle) { toast(prev ? "일정을 고쳤습니다" : "일정을 추가했습니다"); return; }
  toast("일정을 저장했습니다 · Google 캘린더에 올리는 중…");
  try {
    const gid = await addToGoogle(data);
    if (gid) await saveEvent({ ...data, gcalId: gid }).catch(() => {});
    toast("Google 캘린더에도 추가했습니다");
  } catch (err) { toast("수첩에는 저장했습니다. " + gWriteMsg(err, "추가")); }
});

$("fDelete").addEventListener("click", async () => {
  const prev = editingG ? null : state.events.find(e => e.id === state.editing);
  const inGoogle = !!editingG || (!!prev?.gcalId && gReady());
  if (!deleteArmed) {
    deleteArmed = true; $("fDelete").classList.add("armed");
    $("fDelete").textContent = inGoogle ? "한 번 더 누르면 Google 캘린더에서도 삭제" : "한 번 더 누르면 삭제";
    return;
  }
  if (editingG) {
    busy(true);
    try { await deleteGoogle(editingG.gid); dlg.close(); toast("Google 캘린더에서 삭제했습니다"); }
    catch (err) { busy(false); disarm(); $("fErr").textContent = gWriteMsg(err, "삭제"); }
    return;
  }
  busy(true);
  try { await removeEvent(state.editing); }
  catch (err) { busy(false); $("fErr").textContent = errMsg(err); disarm(); return; }
  dlg.close();
  if (!inGoogle) { toast("일정을 삭제했습니다"); return; }
  try { await deleteGoogle(prev.gcalId); toast("일정을 삭제했습니다 · Google 캘린더에서도 삭제"); }
  catch (err) { toast("수첩에서는 지웠습니다. " + gWriteMsg(err, "삭제")); }
});
$("fCancel").addEventListener("click", () => dlg.close());

// ---------- 컨트롤 ----------
function shiftMonth(n) { const d = new Date(state.view.y, state.view.m + n, 1); state.view = { y: d.getFullYear(), m: d.getMonth() }; render(); watchGoogle(); }
$("prevM").addEventListener("click", () => shiftMonth(-1));
$("nextM").addEventListener("click", () => shiftMonth(1));
$("goToday").addEventListener("click", () => { state.selected = state.today; const d = parse(state.today); state.view = { y: d.getFullYear(), m: d.getMonth() }; render(); watchGoogle(); });
$("addBtn").addEventListener("click", () => openEditor(null));
$("addDay").addEventListener("click", () => openEditor(null, state.selected));
$("search").addEventListener("input", e => { state.query = e.target.value; render(); });
document.addEventListener("keydown", e => {
  if (dlg.open || e.target.matches("input, textarea, select")) return;
  if (e.key === "n") { e.preventDefault(); openEditor(null); }
  if (e.key === "ArrowLeft" && e.altKey) shiftMonth(-1);
  if (e.key === "ArrowRight" && e.altKey) shiftMonth(1);
});

// ---------- 내보내기 / 가져오기 ----------
const BACKUP_APP = "schedule-notebook";
const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && ymd(parse(s)) === s;
const isTime = s => typeof s === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
const dupKey = e => [e.date, e.start || "", e.end || "", String(e.title || "").trim()].join("|");

function exportEvents() {
  if (state.mode === "loading") { toast("일정을 불러오는 중입니다. 잠시 후 다시 눌러 주세요."); return; }
  if (!state.events.length) { toast("내보낼 일정이 없습니다."); return; }
  // Google 캘린더 연결 정보(gcalId)는 계정에 묶여 있으므로 백업에 넣지 않는다.
  const events = state.events.map(({ gcalId, source, ...e }) => e);
  const payload = { app: BACKUP_APP, version: 1, exportedAt: new Date().toISOString(), events };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `schedule-backup-${state.today}.json`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast(`내보내기 파일을 만들었습니다 · 일정 ${events.length}개`);
}

// 가져온 값을 검사하고 앱이 쓰는 형태로 정리한다. 쓸 수 없으면 null.
function cleanEvent(x) {
  if (!x || typeof x !== "object" || typeof x.title !== "string" || !x.title.trim() || !isDate(x.date)) return null;
  const start = isTime(x.start) ? x.start : "";
  let end = isTime(x.end) ? x.end : "";
  if (!start || (end && end < start)) end = "";
  return {
    id: typeof x.id === "string" && /^[\w-]{1,64}$/.test(x.id) ? x.id : newId(),
    title: x.title.trim().slice(0, 120), date: x.date, start, end,
    cat: CATS.some(c => c.id === x.cat) ? x.cat : "etc",
    note: typeof x.note === "string" ? x.note.slice(0, 1000) : "",
    done: x.done === true,
    created: typeof x.created === "string" ? x.created : new Date().toISOString(),
  };
}

async function importFile(file) {
  if (state.mode === "loading") { toast("일정을 불러오는 중입니다. 잠시 후 다시 시도하세요."); return; }
  if (file.size > 5 * 1024 * 1024) { toast("파일이 너무 큽니다 (최대 5MB)."); return; }
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast("올바른 JSON 파일이 아닙니다."); return; }
  const list = Array.isArray(data) ? data : (data && data.app === BACKUP_APP && Array.isArray(data.events) ? data.events : null);
  if (!list) { toast("일정 수첩에서 내보낸 파일이 아닙니다."); return; }
  if (list.length > 5000) { toast("일정이 너무 많습니다 (최대 5000개)."); return; }

  // 기존 일정은 건드리지 않는다. 같은 날짜·시간·제목이 이미 있으면 건너뛴다.
  const seen = new Set(state.events.map(dupKey));
  const ids = new Set(state.events.map(e => e.id));
  const add = [];
  let dup = 0, bad = 0;
  for (const raw of list) {
    const e = cleanEvent(raw);
    if (!e) { bad++; continue; }
    const k = dupKey(e);
    if (seen.has(k)) { dup++; continue; }
    seen.add(k);
    if (ids.has(e.id)) e.id = newId();
    ids.add(e.id);
    add.push(e);
  }

  if (add.length) {
    try {
      if (state.mode === "db") {
        for (let i = 0; i < add.length; i += 20) {
          await Promise.all(add.slice(i, i + 20).map(({ id, ...body }) => col.doc(id).set(body)));
        }
      } else {
        state.events.push(...add);
        if (!lsSave()) { state.events = state.events.filter(e => !add.includes(e)); throw new Error("이 브라우저에서는 저장할 수 없습니다."); }
        render();
      }
    } catch (err) { toast("가져오기에 실패했습니다. " + errMsg(err)); return; }
  }
  const parts = [`${add.length}개 추가`];
  if (dup) parts.push(`${dup}개는 이미 있어 건너뜀`);
  if (bad) parts.push(`${bad}개는 형식이 맞지 않아 제외`);
  toast("가져오기 완료 · " + parts.join(", "));
}

$("exportBtn").addEventListener("click", exportEvents);
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", async e => {
  const f = e.target.files[0];
  e.target.value = ""; // 같은 파일을 다시 고를 수 있게
  if (f) await importFile(f);
});

let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, msg.length > 30 ? 5000 : 2200); }

// 자정이 지나면 '오늘'을 갱신
setInterval(() => { const t = ymd(new Date()); if (t !== state.today) { if (state.selected === state.today) state.selected = t; state.today = t; render(); } }, 60000);

render();
connect();
connectGoogle();
</script>
