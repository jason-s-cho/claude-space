# 논문 서재 설치 파일 만들기: Windows 설치 파일(.exe)과 macOS 앱(.dmg)을 빌드해
# 저장소의 Releases 페이지에 올린다.
name: 논문 서재 설치 파일

on:
  push:
    branches: [main, "claude/**"]
    paths: ["papers/**", "!papers/CHANGELOG.md", "!papers/README.md"]
  workflow_dispatch:
    inputs:
      release_name:
        description: "정식판 이름 (예: 논문 서재 1.3.0 정식판). 비우면 '빌드 N'으로 올림"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: papers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: python -m pip install -r requirements-build.txt
      - name: PyInstaller 빌드
        run: pyinstaller --noconfirm packaging/papershelf.spec
      - name: 실행 시험
        shell: pwsh
        run: |
          $lib = Join-Path $env:RUNNER_TEMP "lib"
          $t = Start-Process dist\PaperShelf\PaperShelf.exe -ArgumentList "--selftest" -PassThru -Wait
          Get-Content "$env:USERPROFILE\.papershelf.log" -ErrorAction SilentlyContinue
          if ($t.ExitCode -ne 0) { throw "창 엔진(WebView2)을 불러오지 못했습니다" }
          $p = Start-Process dist\PaperShelf\PaperShelf.exe -ArgumentList "--browser","--no-browser","--no-tray","--offline","--library",$lib -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { $info = Invoke-RestMethod http://127.0.0.1:8765/api/info; $ok = $true; break } catch {}
          }
          Get-Content "$env:USERPROFILE\.papershelf.log" -ErrorAction SilentlyContinue
          if (-not $ok) { throw "앱이 응답하지 않습니다" }
          $info | ConvertTo-Json
          Invoke-RestMethod -Method Post http://127.0.0.1:8765/api/quit | Out-Null
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "종료되지 않습니다" }
      - name: 설치 파일 만들기 (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = (Select-String -Path app.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $defs = @("/DAppVersion=$ver")
          if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\Korean.isl") { $defs += "/DKorean" }
          & $iscc @defs packaging\papershelf.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 실패" }
          Get-ChildItem dist\*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: papers/dist/PaperShelf-Setup-*.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: papers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: python -m pip install -r requirements-build.txt
      - name: PyInstaller 빌드
        run: pyinstaller --noconfirm packaging/papershelf.spec
      - name: 실행 시험
        run: |
          "dist/논문 서재.app/Contents/MacOS/PaperShelf" --selftest || { cat ~/.papershelf.log; echo "창 엔진(WebKit)을 불러오지 못했습니다"; exit 1; }
          "dist/논문 서재.app/Contents/MacOS/PaperShelf" --browser --no-browser --no-tray --offline --library "$RUNNER_TEMP/lib" &
          PID=$!
          for i in $(seq 1 30); do sleep 1; curl -sf http://127.0.0.1:8765/api/info && break; done
          cat ~/.papershelf.log || true
          curl -sf http://127.0.0.1:8765/api/info > /dev/null
          curl -sf -X POST http://127.0.0.1:8765/api/quit
          for i in $(seq 1 15); do sleep 1; kill -0 $PID 2>/dev/null || exit 0; done
          kill $PID; echo "종료되지 않습니다"; exit 1
      - name: DMG 만들기
        run: |
          VER=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app.py)
          mkdir -p dmg && cp -R "dist/논문 서재.app" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "논문 서재" -srcfolder dmg -ov -format UDZO "dist/PaperShelf-${VER}-mac-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: papers/dist/*.dmg

  release:
    needs: [windows, macos]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: 버전
        id: ver
        run: echo "v=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' papers/app.py)" >> "$GITHUB_OUTPUT"
      - name: 릴리스 이름과 설명
        id: rel
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          VER: ${{ steps.ver.outputs.v }}
          RUN: ${{ github.run_number }}
        run: |
          if [ -n "$RELEASE_NAME" ]; then
            echo "tag=papershelf-v${VER}" >> "$GITHUB_OUTPUT"
            echo "name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=papershelf-v${VER}-build${RUN}" >> "$GITHUB_OUTPUT"
            echo "name=논문 서재 ${VER} (빌드 ${RUN})" >> "$GITHUB_OUTPUT"
          fi
          {
            cat <<'TXT'
          ## 설치
          - **Windows**: `PaperShelf-Setup-….exe`를 받아 실행하세요. 관리자 권한 없이 설치됩니다.
            "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**을 누르세요.
          - **macOS**: Apple 칩(M1 이후)은 `…-mac-apple-silicon.dmg`, Intel Mac은 `…-mac-intel.dmg`.
            DMG를 열고 `논문 서재`를 Applications로 끌어 놓으세요. 처음 열 때 막히면
            **시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기**를 누르세요.

          실행하면 브라우저 없이 '논문 서재' 프로그램 창이 열립니다. 창을 닫으면 프로그램도 끝납니다.
          소스 코드 전체는 아래 **Source code (zip)** 으로 받을 수 있습니다.

          TXT
            # 변경 기록에서 이번 버전 부분만
            awk -v v="$VER" '/^## /{p = ($2 == v)} p' papers/CHANGELOG.md
          } | sed 's/^          //' > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.name }}
          make_latest: true
          files: out/**/*
          body_path: release-notes.md
