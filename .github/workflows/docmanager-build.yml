name: Doc manager build

# doc-manager/ 가 바뀐 커밋을 푸시하거나, 수동 실행(Actions 탭 → Run workflow) 하거나,
# docmanager-v* 태그를 푸시하면 문서 보관함의 Windows / macOS / Linux 설치 파일을 빌드한다.
# 설치 파일은 실행 결과 화면 아래 Artifacts 에서 받는다.
# 기본 브랜치에 들어온 커밋(PR 머지)과 docmanager-v* 태그는 GitHub 릴리스(docmanager-v0.2.빌드번호)에도 올라가고,
# 설치된 앱은 그 릴리스를 보고 "새 버전이 나왔습니다" 알림을 띄운다.
# (Run workflow 버튼은 이 파일이 기본 브랜치에 있어야 보인다.)
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["doc-manager/**", ".github/workflows/docmanager-build.yml"]
    tags:
      - "docmanager-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: doc-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: doc-manager/package-lock.json

      - run: npm ci

      - run: npm test

      # 빌드할 때마다 버전 번호를 올린다 (0.2.빌드번호). 새 설치 파일을 실행하면
      # 같은 앱의 이전 버전을 지우고 새 버전으로 바꾼다. 문서와 분류·태그·메모는 그대로 남는다.
      # 윈도우 기본 셸(PowerShell)은 -c.extraMetadata… 를 점에서 잘라 버리므로 bash 로 실행한다.
      - run: npm run dist -- -c.extraMetadata.version=0.2.${{ github.run_number }}
        shell: bash
        env:
          # 코드 서명 인증서가 없으므로 자동 탐색을 끈다.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            doc-manager/dist/*.exe
            doc-manager/dist/*.dmg
            doc-manager/dist/*.AppImage
            doc-manager/dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/docmanager-v') || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.2.${{ github.run_number }}
        run: |
          # 태그로 실행했으면 그 태그, 기본 브랜치 커밋이면 빌드 번호로 새 태그를 만든다 (앱 버전과 같은 번호)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="docmanager-v$VERSION"; fi
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "문서 보관함 $VERSION" \
            --generate-notes \
            --latest
